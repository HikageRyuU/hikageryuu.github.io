                {source: 'cryd', target: 'crsy', value: '养子'},
                {source: 'lyhx', target: 'cryd', value: '……'},
                {source: 'f', target: 'yt', value: '去死'},
                {source: 'f', target: 'nbj', value: '……'},
                {source: 'yt', target: 'f', value: '喜欢喜欢喜欢喜欢喜欢喜欢'},
                {source: 'Na', target: 'Gl', value: '喜欢得不行'},
                {source: 'Na', target: 'El', value: '喜欢'},
                {source: 'Na', target: 'Si', value: '哥哥'},
                {source: 'Si', target: 'El', value: '朋友'},
                {source: 'Si', target: 'Na', value: '弟'},
                {source: 'Si', target: 'Gl', value: '……'},
                {source: 'Gl', target: 'Na', value: '喜欢'},
                {source: 'Gl', target: 'El', value: '妹'},
                {source: 'El', target: 'Gl', value: '哥'},
                {source: 'El', target: 'Na', value: '喜欢'}
            ]
        }]
    };

    (function handleParallelEdges() {
        const links = option.series[0].links;
        const edgeMap = new Map();
        const BASE_CURVE = 0.12; // 曲率
        
        links.forEach(link => {
            const s = String(link.source);
            const t = String(link.target);
            const key = [s, t].sort().join('|');
            if (!edgeMap.has(key)) edgeMap.set(key, []);
            edgeMap.get(key).push(link);
        });

        edgeMap.forEach((edgeList) => {
            const count = edgeList.length;
            if (count === 1) {
                const link = edgeList[0];
                if (!link.lineStyle) link.lineStyle = {};
                if (!link.lineStyle.normal) link.lineStyle.normal = {};
                link.lineStyle.normal.curveness = 0;
                return;
            }

            const isMutualSame = count === 2 && edgeList[0].value === edgeList[1].value;

            edgeList.forEach((link, index) => {
                if (!link.lineStyle) link.lineStyle = {};
                if (!link.lineStyle.normal) link.lineStyle.normal = {};
                if (!link.edgeLabel) link.edgeLabel = {};
                if (!link.edgeLabel.normal) link.edgeLabel.normal = {};

                if (isMutualSame) {
                    link.lineStyle.normal.curveness = 0;
                    
                    if (index === 0) {
                        link.edgeLabel.normal.show = true;
                        link.edgeLabel.normal.position = 'middle'; 
                    } else {
                        link.edgeLabel.normal.show = false;
                    }
                } else {
                    link.lineStyle.normal.curveness = BASE_CURVE * (index + 1);
                    link.edgeLabel.normal.position = 'top';
                    link.edgeLabel.normal.distance = 5 + (index * 6);
                    link.edgeLabel.normal.show = true;
                }
            });
        });
    })();

    (function filterByFocus() {
        const focusId = new URLSearchParams(location.search).get('focus');
        if (!focusId) return;

        const series = option.series[0];
        const relatedLinks = series.links.filter(l =>
        String(l.source) === focusId || String(l.target) === focusId
        );
        const relatedIds = new Set([focusId]);
        relatedLinks.forEach(l => {
            relatedIds.add(String(l.source));
            relatedIds.add(String(l.target));
        });
        series.data = series.data.filter(n => relatedIds.has(String(n.id)));
        series.links = relatedLinks;
    })();

(function computeDynamicEdgeLengths() {
        var links = option.series[0].links;
        var nodes = option.series[0].data;
        var MIN_LEN = 180;     // 最短边
        var MAX_LEN = 620;     // 最长边
        var MAIN_EXTRA = 100;   // 双主角加长

        var nodeMap = {};
        nodes.forEach(function (n) { nodeMap[n.id] = n; });

        var adjacency = {};
        nodes.forEach(function (n) { adjacency[n.id] = {}; });
        links.forEach(function (l) {
            var s = String(l.source), t = String(l.target);
            if (adjacency[s]) adjacency[s][t] = true;
            if (adjacency[t]) adjacency[t][s] = true;
        });
        var degree = {};
        for (var id in adjacency) degree[id] = Object.keys(adjacency[id]).length;

        var outgoing = {};
        nodes.forEach(function (n) { outgoing[n.id] = {}; });
        links.forEach(function (l) {
            var s = String(l.source), t = String(l.target);
            if (outgoing[s]) outgoing[s][t] = true;
        });

        links.forEach(function (l) {
            var s = String(l.source), t = String(l.target);
            var degS = degree[s] || 1;
            var degT = degree[t] || 1;
            var importance = (1 / degS + 1 / degT) / 2;

            var isMutual = outgoing[s] && outgoing[t] && outgoing[s][t] && outgoing[t][s];
            if (isMutual) {
                importance = Math.min(1, importance * 1.5);
            } else {
                importance = importance * 0.85;
            }

            var len = MIN_LEN + (MAX_LEN - MIN_LEN) * (1 - importance);

            var ns = nodeMap[s], nt = nodeMap[t];
            if (ns && nt && ns.main === 1 && nt.main === 1) {
                len += MAIN_EXTRA;
            }

            l._len = Math.round(len);
        });
    })();


    chart.setOption(option);

    // 节点点击跳转
    chart.on('click', function (params) {
        if (params.dataType === 'node' && params.data.link) {
            window.open(params.data.link, '_blank');
        }
    });

    // 自适应窗口大小
    window.addEventListener('resize', function() {
        chartDom.style.height = (window.innerHeight - 100) + 'px';
        chart.resize();
    });

    const params = new URLSearchParams(location.search)
    const id = params.get('focus')
    id && setTimeout(()=>{
      chart.dispatchAction({type:'focusNodeAdjacency',dataIndex:option.series[0].data.findIndex(i=>i.id==id)})
    },500)
</script>
